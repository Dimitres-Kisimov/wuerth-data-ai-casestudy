name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install matplotlib pytest ruff
      - name: Lint
        run: python -m ruff check .
      - name: Consistency / anti-drift guard
        run: python -m validation.consistency_check
      - name: Skill-coverage matrix guard
        run: python -m validation.skill_coverage
      - name: Test
        run: python -m pytest -q
